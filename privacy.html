<!-- 1. ZARİF, MİNİMALİST VE KİBAR CSS TASARIMI -->
<style>
  /* Menü Genel Alanı (Kaba kutu yerine ince, modern ve şeffaf alt çizgili minimalist hat) */
  .custom-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 12px 0;
    background-color: transparent;
    border-bottom: 1px solid #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin-bottom: 30px;
  }

  /* Kibar Link Tasarımı (Arka plan dolgusu yerine sadece zarif bir yazı) */
  .custom-nav a {
    text-decoration: none;
    color: #718096;
    padding: 8px 0;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: -0.2px;
    transition: color 0.2s ease, border-color 0.2s ease;
    display: inline-flex;
    align-items: center;
    position: relative;
    border-bottom: 2px solid transparent;
    margin-bottom: -13px; /* Alt çizgiyle tam sıfırlanma hissi için */
  }

  /* Fareyle Üzerine Gelindiğinde (Yumuşak Koyu Ton Geçişi) */
  .custom-nav a:hover {
    color: #1a202c;
  }

  /* Aktif Olan Sayfa Tasarımı (Zarif İnce Alt Çizgi Efekti) */
  .custom-nav a.active {
    color: #3182ce;
    font-weight: 600;
    border-bottom: 2px solid #3182ce;
  }
</style>

<!-- 3. AKILLI VE GİTHUB PAGES UYUMLU JAVASCRIPT -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Tarayıcıdaki adresi al ve temizle
    let currentPath = window.location.pathname.split("/").pop().toLowerCase();
    
    // GitHub Pages ana dizin kontrolleri (Boş kalma durumları için)
    if (currentPath === "" || currentPath === "/" || currentPath === "mutinoustube.github.io") {
      currentPath = "index.html";
    }
    
    const navLinks = document.querySelectorAll(".custom-nav a");
    
    navLinks.forEach(link => {
      // Kod içindeki href değerini al ve küçük harfe çevirerek karşılaştır
      const linkHref = link.getAttribute("href").toLowerCase();
      
      if (linkHref === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>
