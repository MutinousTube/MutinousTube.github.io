<!-- 1. PREMIUM, ULTRA ZARİF VE KİBAR TEK SATIR MENÜ TASARIMI     -->
<!-- ============================================================ -->
<style>
  /* Sayfa Reset ve Temel Ayarlar */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #f8fafc;
    min-height: 100vh;
    padding: 16px;
  }

  /* Menü Ana Gövdesi (Yüzen, incecik, şeffaf cam kapsül) */
  .mutinous-nav {
    max-width: 1200px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 6px 18px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(0, 0, 0, 0.04);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: nowrap;
    overflow: hidden;
  }

  /* Zarif Logo Alanı */
  .mutinous-brand {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.4px;
    white-space: nowrap;
    padding: 6px 8px;
  }
  .mutinous-brand span {
    color: #3182ce;
    font-weight: 800;
    margin-left: 1px;
  }

  /* İnce Ok Biçimli Kibar Geri Butonu */
  .mutinous-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #94a3b8;
    width: 28px;
    height: 28px;
    font-size: 14px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(0, 0, 0, 0.02);
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .mutinous-back:hover {
    background: rgba(0, 0, 0, 0.05);
    color: #1e293b;
    transform: translateX(-1px);
  }

  /* Tek Satırda Kayan Kibar Link Alanı */
  .mutinous-links {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    justify-content: flex-end;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none; /* Firefox için scrollbar gizleme */
  }
  .mutinous-links::-webkit-scrollbar {
    display: none; /* Chrome/Safari için scrollbar gizleme */
  }

  /* Minimalist Link Tasarımı (Yazı İnceltildi ve Harf Aralıkları Açıldı) */
  .mutinous-links a {
    text-decoration: none;
    color: #64748b;
    padding: 6px 12px;
    border-radius: 12px;
    font-weight: 500;
    font-size: 12.5px;
    letter-spacing: 0.1px;
    transition: all 0.2s ease;
    background: transparent;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .mutinous-links a:hover {
    color: #0f172a;
    background: rgba(0, 0, 0, 0.02);
  }

  /* TIKLANAN / AKTİF OLAN SAYFA (Kibar Pastel Mavi Bulut Efekti) */
  .mutinous-links a.active {
    background: rgba(49, 130, 206, 0.08) !important;
    color: #3182ce !important;
    font-weight: 600;
  }

  /* Ekran Küçüldükçe Taşmayı Önleyen Hassas Ayar */
  @media (max-width: 768px) {
    .mutinous-nav { padding: 5px 12px; border-radius: 14px; }
    .mutinous-links a { font-size: 11.5px; padding: 5px 10px; }
  }
</style>

<!-- 3. OTOMATİK AKTİF SAYFA RENKLENDİRİCİ JAVASCRIPT            -->
<!-- ============================================================ -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Adres çubuğundaki sayfa adını temiz bir şekilde alır ve küçük harfe zorlar
    let currentPath = window.location.pathname.split("/").pop().toLowerCase();
    
    // GitHub Pages ana sayfa yönlendirmesi boş gelirse index.html kabul et
    if (currentPath === "" || currentPath === "/" || currentPath === "mutinoustube.github.io") {
      currentPath = "index.html";
    }
    
    // Menüdeki tüm linkleri bul ve eşleştir
    const navLinks = document.querySelectorAll(".mutinous-links a");
    navLinks.forEach(link => {
      const linkHref = link.getAttribute("href").toLowerCase();
      if (linkHref === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>
