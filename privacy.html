<!-- 1. ELİT, KİBAR VE SÜPER MODERM CSS TASARIMI -->
<style>
  /* Menü Ana Gövdesi - Havada uçan, incecik çizgili cam kapsül */
  .custom-nav {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px); /* Arkadaki içeriği hafifçe bulanıklaştıran modern cam efekti */
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 30px; /* Tam yuvarlatılmış kibar kapsül hatları */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    margin: 20px auto;
    max-width: fit-content;
  }

  /* Zarif İnce Link Tasarımı */
  .custom-nav a {
    text-decoration: none;
    color: #64748b; /* Kibar füme/gri tonu */
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 500;
    font-size: 13.5px;
    letter-spacing: 0.2px; /* Harf araları hafif açılarak kibarlaştırıldı */
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }

  /* Fareyle Üzerine Gelindiğinde (Yumuşak Geçiş Efekti) */
  .custom-nav a:hover {
    color: #1e293b; /* Koyu antrasit */
    background-color: rgba(0, 0, 0, 0.03);
  }

  /* TIKLANMIŞ / AKTİF OLAN SAYFA TASARIMI */
  /* Kaba kutular yerine, yazının arkasında hafif parlayan pastel mavi bir bulut efekti */
  .custom-nav a.active {
    color: #2563eb !important; /* Premium Canlı Mavi */
    background-color: rgba(37, 99, 235, 0.08) !important; /* Gözü yormayan pastel mavi arka plan dolgusu */
    font-weight: 600;
  }
</style>

<!-- 3. BÜYÜK/KÜÇÜK HARF DUYARLI AKILLI JAVASCRIPT BULUCU -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Tarayıcıdaki adresi al, temizle ve küçük harfe zorla
    let currentPath = window.location.pathname.split("/").pop().toLowerCase();
    
    // GitHub Pages ana dizin (boş kalma veya sadece eğik çizgi) kontrolleri
    if (currentPath === "" || currentPath === "/" || currentPath === "mutinoustube.github.io") {
      currentPath = "index.html";
    }
    
    const navLinks = document.querySelectorAll(".custom-nav a");
    
    navLinks.forEach(link => {
      // Kod içindeki href değerini al ve küçük harfe çevirerek karşılaştır (Hata payını sıfırlar)
      const linkHref = link.getAttribute("href").toLowerCase();
      
      if (linkHref === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>
