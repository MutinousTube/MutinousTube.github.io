<!-- 1. MODERN VE ŞIK CSS TASARIMI -->
<style>
  /* Menü Genel Kutusu */
  .custom-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px;
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin-bottom: 20px;
  }

  /* Standart Buton Tasarımı */
  .custom-nav a {
    text-decoration: none;
    color: #4a5568;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    background-color: #f7fafc;
    border: 1px solid #e2e8f0;
    display: inline-flex;
    align-items: center;
  }

  /* Fareyle Üzerine Gelindiğinde (Hover Animasyonu) */
  .custom-nav a:hover {
    background-color: #edf2f7;
    color: #1a202c;
    border-color: #cbd5e0;
    transform: translateY(-1px);
  }

  /* Tıklanmış / Aktif Olan Sayfa Tasarımı (Canlı Mavi ve Hafif Parlama) */
  .custom-nav a.active {
    background-color: #3182ce;
    color: #ffffff;
    border-color: #3182ce;
    box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    transform: none;
  }
</style>

<!-- 3. GİTHUB PAGES UYUMLU AKTİF SAYFA BULUCU JAVASCRIPT -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Mevcut URL yolunu al, temizle ve küçük harfe çevir
    let currentPath = window.location.pathname.split("/").pop().toLowerCase();
    
    // GitHub Pages ana sayfa yönlendirmesi için kontrol (Boşsa index.html yap)
    if (currentPath === "" || currentPath === "/") {
      currentPath = "index.html";
    }
    
    // Menüdeki tüm linkleri tara
    const navLinks = document.querySelectorAll(".custom-nav a");
    
    navLinks.forEach(link => {
      // Linklerin href değerini küçük harfe çevirerek eşleştir
      const linkHref = link.getAttribute("href").toLowerCase();
      
      if (linkHref === currentPath) {
        link.classList.add("active");
      }
    });
  });
</script>
