<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MutinousTube - Zarif Menü</title>
    
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 10px;
        }

        /* ===== MENÜ - TEK SATIR KOMPAKT ===== */
        .mutinous-nav {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 4px 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2px;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .mutinous-nav::-webkit-scrollbar {
            display: none;
        }

        /* ===== LOGO ===== */
        .mutinous-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
            white-space: nowrap;
            padding: 3px 6px;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .mutinous-brand:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .mutinous-brand span {
            background: linear-gradient(135deg, #6c63ff, #5a52d5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== GERİ BUTONU ===== */
        .mutinous-back {
            display: flex;
            align-items: center;
            gap: 1px;
            text-decoration: none;
            color: #8a8aaa;
            font-size: 12px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 14px;
            background: rgba(108, 99, 255, 0.04);
            border: 1px solid rgba(108, 99, 255, 0.05);
            transition: all 0.25s ease;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .mutinous-back:hover {
            background: rgba(108, 99, 255, 0.10);
            color: #5a52d5;
            transform: translateX(-2px);
        }

        .mutinous-back .back-icon {
            font-size: 12px;
            transition: transform 0.25s ease;
        }

        .mutinous-back:hover .back-icon {
            transform: translateX(-3px);
        }

        /* ===== MENÜ LİNKLERİ ===== */
        .mutinous-links {
            display: flex;
            align-items: center;
            gap: 1px;
            flex: 1;
            justify-content: flex-end;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .mutinous-links::-webkit-scrollbar {
            display: none;
        }

        .mutinous-links a {
            text-decoration: none;
            color: #5a5a7a;
            padding: 3px 10px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
            border: 1px solid transparent;
            white-space: nowrap;
            letter-spacing: 0.1px;
            flex-shrink: 0;
        }

        .mutinous-links a:hover {
            background: rgba(108, 99, 255, 0.06);
            color: #2d2b55;
            border-color: rgba(108, 99, 255, 0.08);
        }

        .mutinous-links a.active {
            background: linear-gradient(135deg, #6c63ff, #5a52d5);
            color: #ffffff;
            border-color: #6c63ff;
            box-shadow: 0 2px 10px rgba(108, 99, 255, 0.18);
        }

        .mutinous-links a:active {
            transform: scale(0.94);
            transition-duration: 0.05s;
        }

        .mutinous-links a .link-icon {
            margin-right: 2px;
            font-size: 11px;
        }

        /* ============================================================ */
        /* RESPONSIVE - DAR EKRANLAR */
        /* ============================================================ */
        @media (max-width: 900px) {
            .mutinous-nav {
                padding: 3px 10px;
                border-radius: 10px;
                gap: 1px;
            }

            .mutinous-brand {
                font-size: 13px;
                padding: 2px 4px;
            }

            .mutinous-links a {
                font-size: 11px;
                padding: 2px 8px;
            }

            .mutinous-back {
                font-size: 11px;
                padding: 2px 6px;
            }

            .mutinous-back .back-text {
                display: none;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 5px;
            }

            .mutinous-nav {
                padding: 2px 8px;
                border-radius: 8px;
                gap: 0px;
            }

            .mutinous-brand {
                font-size: 11px;
                padding: 2px 3px;
            }

            .mutinous-links a {
                font-size: 10px;
                padding: 2px 6px;
                border-radius: 10px;
            }

            .mutinous-links a .link-icon {
                font-size: 10px;
                margin-right: 1px;
            }

            .mutinous-back {
                font-size: 10px;
                padding: 1px 5px;
                border-radius: 10px;
            }

            .mutinous-back .back-icon {
                font-size: 10px;
            }
        }

        /* ===== SAYFA İÇERİK ÖRNEĞİ ===== */
        .page-content {
            max-width: 800px;
            margin: 25px auto 0;
            text-align: center;
            color: #4a4a6a;
            font-size: 15px;
            line-height: 1.7;
            padding: 20px;
        }

        .page-content h2 {
            color: #1a1a2e;
            font-weight: 600;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .page-content p {
            color: #6a6a8a;
        }

        .page-content .highlight {
            display: inline-block;
            background: #f0f0f5;
            padding: 2px 12px;
            border-radius: 6px;
            color: #6c63ff;
            font-weight: 600;
        }

        .demo-note {
            margin-top: 12px;
            font-size: 12px;
            color: #9a9aba;
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>

    <!-- ============================================================ -->
    <!-- KOMPAKT TEK SATIR MENÜ -->
    <!-- ============================================================ -->
    <nav class="mutinous-nav">

        <!-- LOGO -->
        <a href="https://mutinoustube.github.io/" class="mutinous-brand" title="MutinousTube Ana Sayfa">
            Mutinous<span>Tube</span>
        </a>

        <!-- GERİ BUTONU -->
        <a href="#" class="mutinous-back" onclick="history.back(); return false;" title="Geri Dön">
            <span class="back-icon">←</span>
            <span class="back-text">Geri</span>
        </a>

        <!-- MENÜ LİNKLERİ -->
        <div class="mutinous-links">
            <a href="index.html"><span class="link-icon">🏠</span> Ana</a>
            <a href="Kampanyalar.html"><span class="link-icon">🎯</span> Kampanya</a>
            <a href="BankaKampanyalari.html"><span class="link-icon">🏦</span> Banka</a>
            <a href="OperatorKampanyasi.html"><span class="link-icon">📱</span> Operatör</a>
            <a href="HatKampanyasi.html"><span class="link-icon">📄</span> Hat</a>
            <a href="interntKampanyakari.html"><span class="link-icon">🌐</span> İnternet</a>
            <a href="Piyasa.html"><span class="link-icon">📊</span> Piyasa</a>
            <a href="ParaKazan.html"><span class="link-icon">💰</span> Kazan</a>
            <a href="MutinousFinance.html"><span class="link-icon">📈</span> Finance</a>
        </div>

    </nav>

    <!-- ============================================================ -->
    <!-- SAYFA İÇERİK ÖRNEĞİ -->
    <!-- ============================================================ -->
    <div class="page-content">
        <h2>✨ Zarif & Kibar Menü</h2>
        <p>
            Tek satırda, şık ve minimal. 
            <span class="highlight">Tıkladığınızda</span> 
            aktif sayfa mor renkle vurgulanır.
        </p>
        <p style="margin-top: 8px; font-size: 13px; color: #8a8aaa;">
            ✦ Kompakt · Kaydırılabilir · Mobil uyumlu
        </p>
        <p class="demo-note">
            ← Geri butonu ile bir önceki sayfaya dönebilirsiniz
        </p>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // Aktif sayfayı bul ve vurgula
            const currentPath = window.location.pathname.split("/").pop();
            const currentPage = currentPath || "index.html";

            const navLinks = document.querySelectorAll(".mutinous-links a");

            navLinks.forEach(link => {
                const linkHref = link.getAttribute("href");
                if (linkHref === currentPage) {
                    link.classList.add("active");
                }
            });

            // Tıklama ile aktifleştir
            navLinks.forEach(link => {
                link.addEventListener("click", function () {
                    navLinks.forEach(l => l.classList.remove("active"));
                    this.classList.add("active");
                });
            });

            console.log("✨ MutinousTube Zarif Menü Aktif");
            console.log(`📄 Mevcut Sayfa: ${currentPage}`);
        });
    </script>

</body>
</html>
